<!DOCTYPE html>
<html lang="id">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Form kasir untuk mencatat penjualan baru.">
    <title>Catat Transaksi - StokKu</title>
    <link rel="stylesheet" href="css/style.css">
</head>

<body data-page="transaksi">
    <a class="sr-only" href="#konten">Lewati ke konten</a>
    <div class="app">
        <aside class="sidebar" id="sidebar"></aside>
        <div class="main">
            <header class="topbar" id="topbar"></header>
            <main class="content" id="konten">
                <div class="page-head">
                    <h1>Form Kasir &amp; Penjualan</h1>
                    <p>Catat pesanan pembeli. Stok produk akan berkurang otomatis.</p>
                </div>

                <section class="card form-card" aria-labelledby="judul-form">
                    <h2 id="judul-form">Catat Penjualan Baru</h2>
                    <p class="sub">Semua kolom bertanda * wajib diisi.</p>

                    <div id="form-area" aria-live="polite">
                        <div class="skeleton" style="height:42px;margin-bottom:14px"></div>
                        <div class="skeleton" style="height:90px;margin-bottom:14px"></div>
                        <div class="skeleton" style="height:42px"></div>
                    </div>
                </section>
            </main>
        </div>
    </div>

    <script src="js/store.js"></script>
    <script src="js/ui.js"></script>
    <script src="js/tambah_transaksi.js"></script>
</body>

</html>
