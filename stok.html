<!DOCTYPE html>
<html lang="id">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Daftar stok barang dagangan dengan pencarian dan filter.">
    <title>Data Stok - StokKu</title>
    <link rel="stylesheet" href="css/style.css">
</head>

<body data-page="stok">
    <a class="sr-only" href="#konten">Lewati ke konten</a>
    <div class="app">
        <aside class="sidebar" id="sidebar"></aside>
        <div class="main">
            <header class="topbar" id="topbar"></header>
            <main class="content" id="konten">
                <div class="page-head" style="display:flex;justify-content:space-between;align-items:flex-end;gap:12px;flex-wrap:wrap">
                    <div>
                        <h1>Data Stok Barang</h1>
                        <p>Daftar ketersediaan barang dagangan, terbarui langsung setiap ada perubahan.</p>
                    </div>
                    <a class="btn" href="tambah_produk.html">+ Tambah Produk</a>
                </div>

                <details class="filter-panel" id="filter-panel" open>
                    <summary>Filter</summary>
                    <div class="filter-grid" id="filter-grid"></div>
                    <div class="filter-actions">
                        <button type="button" class="btn btn-ghost btn-sm" id="btn-reset">Reset filter</button>
                        <span class="result-info" id="result-info" aria-live="polite"></span>
                    </div>
                </details>

                <section class="product-grid" id="grid" aria-label="Daftar produk" aria-busy="true"></section>
            </main>
        </div>
    </div>

    <!-- Modal Edit Stok -->
    <div class="modal-overlay" id="modal-edit">
        <div class="modal" role="dialog" aria-modal="true" aria-labelledby="edit-judul">
            <h2 id="edit-judul">Edit Stok</h2>
            <p class="sub" id="edit-nama"></p>
            <form id="form-edit" novalidate>
                <div class="field">
                    <label for="edit-stok">Jumlah stok</label>
                    <div class="stepper">
                        <button type="button" id="stok-min" aria-label="Kurangi stok">&minus;</button>
                        <input type="number" id="edit-stok" name="stok" inputmode="numeric" min="0" step="1">
                        <button type="button" id="stok-plus" aria-label="Tambah stok">+</button>
                    </div>
                    <p class="field-error"></p>
                </div>
                <div class="form-row">
                    <div class="field">
                        <label for="edit-harga">Harga (Rp)</label>
                        <input type="number" id="edit-harga" name="harga" inputmode="numeric" min="0" step="1">
                        <p class="field-error"></p>
                    </div>
                    <div class="field">
                        <label for="edit-min">Batas stok menipis</label>
                        <input type="number" id="edit-min" name="stokMinimum" inputmode="numeric" min="0" step="1">
                        <p class="field-error"></p>
                    </div>
                </div>
                <div class="modal-actions">
                    <button type="button" class="btn btn-danger btn-sm" id="btn-hapus" style="margin-right:auto">Hapus</button>
                    <button type="button" class="btn btn-ghost" data-close>Batal</button>
                    <button type="submit" class="btn" id="btn-simpan">Simpan</button>
                </div>
            </form>
        </div>
    </div>

    <script src="js/store.js"></script>
    <script src="js/ui.js"></script>
    <script src="js/stok.js"></script>
</body>

</html>
