<!DOCTYPE html>
<html lang="id">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Form untuk menambah produk baru ke daftar stok.">
    <title>Tambah Produk - StokKu</title>
    <link rel="stylesheet" href="css/style.css">
</head>

<body data-page="stok">
    <a class="sr-only" href="#konten">Lewati ke konten</a>
    <div class="app">
        <aside class="sidebar" id="sidebar"></aside>
        <div class="main">
            <header class="topbar" id="topbar"></header>
            <main class="content" id="konten">
                <div class="page-head">
                    <h1>Tambah Produk Baru</h1>
                    <p>Isi detail produk, lalu simpan ke daftar stok.</p>
                </div>

                <section class="card form-card" aria-labelledby="judul-form">
                    <h2 id="judul-form">Detail Produk</h2>
                    <p class="sub">Semua kolom bertanda * wajib diisi.</p>

                    <form id="form-produk" novalidate>
                        <div class="field">
                            <label for="nama">Nama produk *</label>
                            <input type="text" id="nama" name="nama" maxlength="60" autocomplete="off" placeholder="Contoh: Ayam Geprek">
                            <p class="field-error"></p>
                        </div>

                        <div class="field">
                            <label for="kategori">Kategori *</label>
                            <select id="kategori" name="kategori">
                                <option value="">Pilih kategori</option>
                                <option value="Makanan">Makanan</option>
                                <option value="Minuman">Minuman</option>
                                <option value="Lainnya">Lainnya</option>
                            </select>
                            <p class="field-error"></p>
                        </div>

                        <div class="form-row">
                            <div class="field">
                                <label for="harga">Harga (Rp) *</label>
                                <input type="number" id="harga" name="harga" inputmode="numeric" min="0" step="1" placeholder="15000">
                                <p class="field-error"></p>
                            </div>
                            <div class="field">
                                <label for="stok">Jumlah stok awal *</label>
                                <input type="number" id="stok" name="stok" inputmode="numeric" min="0" step="1" placeholder="20">
                                <p class="field-error"></p>
                            </div>
                        </div>

                        <div class="field">
                            <label for="min">Batas stok menipis <span class="opt">(opsional, bawaan 5)</span></label>
                            <input type="number" id="min" name="stokMinimum" inputmode="numeric" min="0" step="1" placeholder="5">
                            <p class="field-help">Produk ditandai "Menipis" saat stok sama dengan atau di bawah angka ini.</p>
                            <p class="field-error"></p>
                        </div>

                        <div class="form-actions">
                            <button type="submit" class="btn" id="btn-simpan">Simpan Produk</button>
                            <a class="btn btn-ghost" href="stok.html">Batal</a>
                        </div>
                    </form>
                </section>
            </main>
        </div>
    </div>

    <script src="js/store.js"></script>
    <script src="js/ui.js"></script>
    <script src="js/tambah_produk.js"></script>
</body>

</html>
