<!DOCTYPE html>
<html lang="id">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="StokKu - pencatatan stok UMKM secara real time.">
    <title>Dashboard - StokKu</title>
    <link rel="stylesheet" href="css/style.css">
</head>

<body data-page="dashboard">
    <a class="sr-only" href="#konten">Lewati ke konten</a>
    <div class="app">
        <aside class="sidebar" id="sidebar"></aside>
        <div class="main">
            <header class="topbar" id="topbar"></header>
            <main class="content" id="konten">
                <div class="page-head">
                    <h1>Dashboard</h1>
                    <p>Ringkasan stok dan penjualan toko kamu hari ini.</p>
                </div>

                <section class="stats" id="stats" aria-label="Ringkasan stok" aria-live="polite"></section>

                <section class="card" aria-labelledby="judul-riwayat">
                    <h2 id="judul-riwayat">Tabel Riwayat Transaksi</h2>
                    <p class="sub">5 transaksi terbaru. <a href="transaksi.html">Lihat semua</a></p>
                    <div class="table-wrap" id="tabel-wrap">
                        <table>
                            <thead>
                                <tr>
                                    <th>ID</th>
                                    <th>Tanggal</th>
                                    <th>Pelanggan</th>
                                    <th>Item</th>
                                    <th class="num">Total</th>
                                    <th>Status</th>
                                </tr>
                            </thead>
                            <tbody id="tabel-body"></tbody>
                        </table>
                    </div>
                </section>
            </main>
        </div>
    </div>

    <script src="js/store.js"></script>
    <script src="js/ui.js"></script>
    <script src="js/dashboard.js"></script>
</body>

</html>
