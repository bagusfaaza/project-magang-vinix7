<!DOCTYPE html>
<html lang="id">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Analisis pergerakan stok dan barang yang hampir habis.">
    <title>Analisis Stok - StokKu</title>
    <link rel="stylesheet" href="css/style.css">
</head>

<body data-page="analisis">
    <a class="sr-only" href="#konten">Lewati ke konten</a>
    <div class="app">
        <aside class="sidebar" id="sidebar"></aside>
        <div class="main">
            <header class="topbar" id="topbar"></header>
            <main class="content" id="konten">
                <div class="page-head">
                    <h1>Analisis &amp; Pergerakan Stok</h1>
                    <p>Lihat barang paling laku dan yang perlu segera diisi ulang.</p>
                </div>

                <div id="analisis-area" aria-live="polite">
                    <section class="stats" id="stats"></section>
                    <div class="grid-2">
                        <section class="card" aria-labelledby="judul-laku">
                            <h2 id="judul-laku">Perputaran Barang</h2>
                            <p class="sub">Jumlah unit terjual per produk dari seluruh transaksi.</p>
                            <div id="chart"></div>
                        </section>
                        <section class="card" aria-labelledby="judul-hampir">
                            <h2 id="judul-hampir">Barang Hampir Habis</h2>
                            <p class="sub">Stok sama dengan atau di bawah batas minimum.</p>
                            <ul class="low-list" id="low-list"></ul>
                        </section>
                    </div>
                </div>
            </main>
        </div>
    </div>

    <script src="js/store.js"></script>
    <script src="js/ui.js"></script>
    <script src="js/analisis.js"></script>
</body>

</html>
