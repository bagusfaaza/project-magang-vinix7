<!DOCTYPE html>
<html lang="id">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Riwayat transaksi penjualan harian.">
    <title>Riwayat Transaksi - StokKu</title>
    <link rel="stylesheet" href="css/style.css">
</head>

<body data-page="transaksi">
    <a class="sr-only" href="#konten">Lewati ke konten</a>
    <div class="app">
        <aside class="sidebar" id="sidebar"></aside>
        <div class="main">
            <header class="topbar" id="topbar"></header>
            <main class="content" id="konten">
                <div class="page-head" style="display:flex;justify-content:space-between;align-items:flex-end;gap:12px;flex-wrap:wrap">
                    <div>
                        <h1>Riwayat Transaksi</h1>
                        <p>Catatan penjualan. Setiap transaksi otomatis mengurangi stok.</p>
                    </div>
                    <a class="btn" href="tambah_transaksi.html">+ Catat Transaksi Baru</a>
                </div>

                <section class="card" aria-labelledby="judul-daftar">
                    <h2 id="judul-daftar">Daftar Transaksi</h2>
                    <p class="sub" id="info-hasil" aria-live="polite">Memuat data...</p>

                    <div class="table-toolbar">
                        <div class="grow">
                            <label class="sr-only" for="q">Cari ID atau nama pelanggan</label>
                            <input type="search" id="q" placeholder="Cari ID atau nama pelanggan..." autocomplete="off">
                        </div>
                        <div>
                            <label class="sr-only" for="status">Filter status</label>
                            <select id="status">
                                <option value="semua">Semua status</option>
                                <option value="Lunas">Lunas</option>
                                <option value="Belum Lunas">Belum Lunas</option>
                            </select>
                        </div>
                    </div>

                    <div id="tabel-area">
                        <div class="table-wrap">
                            <table>
                                <thead>
                                    <tr>
                                        <th>ID</th>
                                        <th>Tanggal</th>
                                        <th>Pelanggan</th>
                                        <th>Item</th>
                                        <th class="num">Total</th>
                                        <th>Status</th>
                                        <th>Aksi</th>
                                    </tr>
                                </thead>
                                <tbody id="tabel-body"></tbody>
                            </table>
                        </div>
                    </div>
                </section>
            </main>
        </div>
    </div>

    <script src="js/store.js"></script>
    <script src="js/ui.js"></script>
    <script src="js/transaksi.js"></script>
</body>

</html>
